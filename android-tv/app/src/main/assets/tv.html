<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poker Clock Pro · Android TV</title>
<style>
:root{color-scheme:dark;--bg:#071014;--panel:#142229;--line:#30464d;--text:#f4f0e7;--muted:#8ca3aa;--gold:#e8bd70;--cyan:#86d0d0;--red:#e3998b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#17313b,var(--bg) 65%);color:var(--text);font:18px system-ui,"PingFang SC",sans-serif;min-height:100vh}main{padding:28px 5vw 40px;max-width:1920px;margin:auto}.brand{color:var(--gold);letter-spacing:.16em;font-size:20px;text-align:center}.mast{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.title{font-size:28px}.status{color:var(--cyan)}.clock{text-align:center;border-bottom:1px solid var(--line);padding:20px 0 26px}.level{color:var(--muted);font-size:20px}.time{font:700 clamp(110px,19vw,300px)/1 ui-monospace,monospace;color:var(--gold);letter-spacing:-.08em;margin:10px 0}.warning .time{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:22px}.stat{background:rgba(20,34,41,.9);border:1px solid var(--line);border-radius:14px;text-align:center;padding:14px}.stat label{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}.stat strong{font-size:28px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.controls button,.setup button,button,input{font:inherit;border-radius:10px;border:1px solid var(--line);background:#20353d;color:var(--text);padding:13px 16px;min-height:52px}button{cursor:pointer}button:focus,input:focus{outline:3px solid var(--cyan);outline-offset:2px}button.primary{background:var(--gold);color:#241d13;border-color:var(--gold)}button.danger{color:var(--red)}details{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:14px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.form label{color:var(--muted);font-size:14px}.form input{display:block;width:100%;margin-top:5px}.setup{max-width:700px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px}.setup h1{margin-top:0}.setup label{display:block;color:var(--muted);margin:14px 0}.setup input{width:100%;display:block;margin-top:6px}.hint{color:var(--muted);font-size:14px;line-height:1.6}.hidden{display:none!important}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}
</style>
<section id="setup" class="setup"><div class="brand">碰鱼 MEETUP</div><h1>Poker Clock Pro · 电视绑定</h1><p class="hint">首次启动请输入 Mac 电脑在本店 Wi-Fi 中的地址和牌桌编号。保存后电视将只显示该牌桌的比赛。</p><label>Mac 服务地址<input id="server" placeholder="http://192.168.1.23:8787"></label><label>牌桌编号<input id="table" value="A01" placeholder="A01"></label><label>设备名称<input id="device" value="Android TV"></label><button class="primary" onclick="saveSetup()">保存并进入比赛大屏</button></section>
<main id="app" class="hidden"><div class="brand">碰鱼 MEETUP · POKER CLOCK PRO</div><div class="mast"><div><div class="title" id="tableTitle">—</div><div class="hint" id="matchTitle">等待比赛</div></div><div class="status" id="connection">正在连接</div></div><section id="display"><div class="clock"><div class="level" id="level">—</div><div class="time" id="time">--:--</div><div id="next" class="hint">—</div></div><div class="stats"><div class="stat"><label>小盲 SB</label><strong id="sb">—</strong></div><div class="stat"><label>大盲 BB</label><strong id="bb">—</strong></div><div class="stat"><label>前注 Ante</label><strong id="ante">—</strong></div><div class="stat"><label>剩余人数</label><strong id="players">—</strong></div><div class="stat"><label>买入次数</label><strong id="entries">—</strong></div><div class="stat"><label>Re-entry / Rebuy / Add-on</label><strong id="extras">—</strong></div></div><div class="controls"><button class="primary" onclick="act(status==='RUNNING'?'pause':'start')" id="run">开始 / 恢复</button><button onclick="act('prev')">← 上一等级</button><button onclick="act('next')">下一等级 →</button><button class="danger" onclick="confirmAction('complete')">结束比赛</button><button onclick="act('players',-1)">剩余人数 −</button><button onclick="act('players',1)">剩余人数 ＋</button><button onclick="act('entries',1)">买入 ＋</button><button onclick="act('reentries',1)">Re-entry ＋</button><button onclick="act('rebuys',1)">Rebuy ＋</button><button onclick="act('addons',1)">Add-on ＋</button></div><details><summary>电视直接设置当前规则（方向键 + OK）</summary><div class="form"><label>SB<input id="editSb" type="number" min="0"></label><label>BB<input id="editBb" type="number" min="0"></label><label>Ante<input id="editAnte" type="number" min="0"></label><label>本级分钟<input id="editMinutes" type="number" min="1"></label></div><button class="primary" onclick="editLevel()">保存规则并暂停本级</button><button onclick="showSetup()">更换服务端 / 牌桌</button></details></section><p class="hint">电视断线不会改变服务器计时；重新连接后自动获取最新快照。</p></main>
<script>
let cfg=JSON.parse(localStorage.getItem('poker-clock-config')||'null'), data, status='READY', timer;
const $=id=>document.getElementById(id); function saveSetup(){let server=$('server').value.trim().replace(/\/$/,''),table=$('table').value.trim().toUpperCase();if(!/^https?:\/\//.test(server)||!/^[A-Z][0-9]{2}$/.test(table)){alert('请填写正确的服务地址和牌桌编号');return}cfg={server,table,device:$('device').value.trim()||'Android TV'};localStorage.setItem('poker-clock-config',JSON.stringify(cfg));location.reload()};function showSetup(){$('app').classList.add('hidden');$('setup').classList.remove('hidden');$('server').value=cfg?.server||'';$('table').value=cfg?.table||'A01'}
async function request(path,opt){let r=await fetch(cfg.server+path,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function fmt(ms){ms=Math.max(0,Number(ms||0));return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')}
function render(){let s=data?.snapshot;if(!s){$('matchTitle').textContent='暂无进行中的比赛';$('connection').textContent='已连接';$('time').textContent='--:--';return}status=s.state.status;$('matchTitle').textContent=s.tournament.name;$('level').textContent=`${s.level.is_break?'BREAK':`Level ${s.level.sequence+1}`} · ${status}`;$('time').textContent=fmt(s.state.remaining_ms);$('sb').textContent=s.level.is_break?'—':s.level.sb;$('bb').textContent=s.level.is_break?'—':s.level.bb;$('ante').textContent=s.level.is_break?'—':s.level.ante;$('players').textContent=s.stats.remaining_players;$('entries').textContent=s.stats.initial_entries;$('extras').textContent=`${s.stats.reentries} / ${s.stats.rebuys} / ${s.stats.addons}`;$('next').textContent=s.next?(s.next.is_break?'下一个：BREAK':`下一级：SB ${s.next.sb} / BB ${s.next.bb} / Ante ${s.next.ante}`):'最后一个等级';$('run').textContent=status==='RUNNING'?'暂停':'开始 / 恢复';if(document.activeElement?.id!=='editSb')$('editSb').value=s.level.sb;if(document.activeElement?.id!=='editBb')$('editBb').value=s.level.bb;if(document.activeElement?.id!=='editAnte')$('editAnte').value=s.level.ante;if(document.activeElement?.id!=='editMinutes')$('editMinutes').value=Math.round(s.level.duration_seconds/60);$('display').classList.toggle('warning',Number(s.state.remaining_ms)<60000)}
async function poll(){if(!cfg)return;try{data=await request('/api/tv/state?tableId='+encodeURIComponent(cfg.table));$('connection').textContent='已连接';render()}catch(e){$('connection').textContent='连接中断'}timer=setTimeout(poll,1000)}
async function act(action,delta=0){if(!data?.snapshot)return;try{await request('/api/tournaments/'+data.snapshot.tournament.id+'/action',{method:'POST',body:JSON.stringify({action,delta})});await poll()}catch(e){alert(e.message)}}function confirmAction(a){if(confirm('确认结束当前比赛？结束后不能恢复倒计时。'))act(a)}async function editLevel(){if(!data?.snapshot)return;try{await request('/api/tournaments/'+data.snapshot.tournament.id+'/action',{method:'POST',body:JSON.stringify({action:'edit_level',sb:Number($('editSb').value),bb:Number($('editBb').value),ante:Number($('editAnte').value),minutes:Number($('editMinutes').value)})});await poll()}catch(e){alert(e.message)}}
if(cfg){$('setup').classList.add('hidden');$('app').classList.remove('hidden');$('tableTitle').textContent=cfg.table+' TABLE';poll()}else showSetup();
</script></html>
