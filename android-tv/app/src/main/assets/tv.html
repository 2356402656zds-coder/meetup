<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>碰鱼 MEETUP · 德州升盲</title>
<style>
:root{color-scheme:dark;--bg:#071014;--panel:#142229;--line:#30464d;--text:#f4f0e7;--muted:#8ca3aa;--gold:#e8bd70;--cyan:#86d0d0;--red:#e3998b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#17313b,var(--bg) 65%);color:var(--text);font:18px system-ui,"PingFang SC",sans-serif;min-height:100vh}main{padding:24px 5vw 30px;max-width:1920px;margin:auto}.brand{color:var(--gold);letter-spacing:.16em;font-size:20px;text-align:center}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.table{font-size:24px}.status{color:var(--cyan)}.clock{text-align:center;border-bottom:1px solid var(--line);padding:18px 0 24px}.level{color:var(--muted);font-size:22px}.time{font:700 clamp(110px,19vw,290px)/1 ui-monospace,monospace;color:var(--gold);letter-spacing:-.08em;margin:10px 0}.warning .time{color:var(--red)}.blinds{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.tile{background:rgba(20,34,41,.92);border:1px solid var(--line);border-radius:14px;text-align:center;padding:14px}.tile label{display:block;color:var(--muted);font-size:15px;margin-bottom:7px}.tile strong{font-size:clamp(24px,4vw,42px)}.next{text-align:center;color:var(--muted);margin-top:18px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px auto;max-width:1000px}.controls button,button,input{font:inherit;border-radius:10px;border:1px solid var(--line);background:#20353d;color:var(--text);padding:12px 16px;min-height:50px}button{cursor:pointer}button:focus,input:focus,summary:focus{outline:3px solid var(--cyan);outline-offset:3px}button.primary{background:var(--gold);color:#241d13;border-color:var(--gold)}button.danger{color:var(--red)}details{margin:16px auto;border:1px solid var(--line);border-radius:12px;padding:14px;max-width:1000px}summary{cursor:pointer;padding:8px;color:var(--gold)}.editor{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.editor label{color:var(--muted);font-size:14px}.editor input{display:block;width:100%;margin-top:6px}.rowlist{max-height:200px;overflow:auto}.row{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;padding:10px;border-bottom:1px solid var(--line);align-items:center}.help{text-align:center;color:var(--muted);font-size:14px}.hidden{display:none!important}
@media(max-width:900px){.blinds{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:repeat(2,1fr)}.editor{grid-template-columns:repeat(2,1fr)}}
</style>
<main>
<div class="brand">碰鱼 MEETUP · POKER CLOCK</div>
<div class="toolbar"><div><div class="table" id="tableName">比赛升盲计时</div><div class="status" id="runState">已暂停</div></div><button onclick="renameTable()">设置比赛名称</button></div>
<section id="display"><div class="clock"><div class="level" id="level">Level 1</div><div class="time" id="time">20:00</div><div class="next" id="next">下一级：200 / 400 / Ante 0</div></div><div class="blinds"><div class="tile"><label>小盲 SB</label><strong id="sb">100</strong></div><div class="tile"><label>大盲 BB</label><strong id="bb">200</strong></div><div class="tile"><label>前注 Ante</label><strong id="ante">0</strong></div><div class="tile"><label>本级时长</label><strong id="duration">20 分钟</strong></div></div></section>
<div class="controls"><button class="primary" id="toggle" onclick="toggleRun()">开始</button><button onclick="move(-1)">← 上一级</button><button onclick="move(1)">下一级 →</button><button onclick="resetLevel()">重置本级</button></div>
<details id="settings"><summary>比赛规则设置（遥控器方向键选择，OK 确认）</summary><div class="editor"><label>SB<input id="inSb" type="number" min="0"></label><label>BB<input id="inBb" type="number" min="0"></label><label>Ante<input id="inAnte" type="number" min="0"></label><label>时长（分钟）<input id="inMinutes" type="number" min="1" max="240"></label><label>阶段名称<input id="inLabel"></label></div><div class="controls"><button class="primary" onclick="saveLevel()">保存当前级</button><button onclick="addLevel()">添加下一级</button><button onclick="removeLevel()">删除当前级</button><button class="danger" onclick="resetAll()">恢复默认规则</button></div><div class="rowlist" id="levels"></div></details>
<p class="help">完全离线运行 · 设置保存在电视本机 · 不连接网络、不收集客户信息</p>
</main>
<script>
const defaults=[{label:'Level 1',sb:100,bb:200,ante:0,minutes:20},{label:'Level 2',sb:200,bb:400,ante:0,minutes:20},{label:'Level 3',sb:300,bb:600,ante:100,minutes:20},{label:'Level 4',sb:500,bb:1000,ante:100,minutes:20},{label:'BREAK',sb:0,bb:0,ante:0,minutes:10,break:true}];
let saved;try{saved=JSON.parse(localStorage.getItem('meetup-poker-clock')||'{}')}catch{saved={}}
let data={name:saved.name||'比赛升盲计时',levels:Array.isArray(saved.levels)&&saved.levels.length?saved.levels:defaults,idx:Math.max(0,Math.min(saved.idx||0,(saved.levels||defaults).length-1)),running:!!saved.running,endsAt:saved.endsAt||null,remaining:saved.remaining??((saved.levels||defaults)[saved.idx||0].minutes*60000)};
const $=id=>document.getElementById(id);function persist(){localStorage.setItem('meetup-poker-clock',JSON.stringify(data))}function current(){return data.levels[data.idx]}function left(){return data.running&&data.endsAt?Math.max(0,data.endsAt-Date.now()):data.remaining}
function render(){let l=current(),n=data.levels[data.idx+1],ms=left();if(data.running&&ms===0){if(n){data.idx++;data.remaining=current().minutes*60000;data.endsAt=Date.now()+data.remaining}else{data.running=false;data.endsAt=null;data.remaining=0}persist();l=current();n=data.levels[data.idx+1];ms=left()}$('tableName').textContent=data.name;$('runState').textContent=data.running?'计时中':(ms===0?'比赛结束':'已暂停');$('toggle').textContent=data.running?'暂停':'开始 / 继续';$('level').textContent=(l.break?'BREAK':l.label)+' · '+(data.idx+1)+' / '+data.levels.length;$('time').textContent=String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');$('sb').textContent=l.break?'—':l.sb;$('bb').textContent=l.break?'—':l.bb;$('ante').textContent=l.break?'—':l.ante;$('duration').textContent=l.minutes+' 分钟';$('next').textContent=n?`下一级：${n.break?'休息':`${n.sb} / ${n.bb} / Ante ${n.ante}`} · ${n.minutes} 分钟`:'最后一级';$('display').classList.toggle('warning',ms<60000&&ms>0);if(document.activeElement?.id!=='inSb')$('inSb').value=l.sb;if(document.activeElement?.id!=='inBb')$('inBb').value=l.bb;if(document.activeElement?.id!=='inAnte')$('inAnte').value=l.ante;if(document.activeElement?.id!=='inMinutes')$('inMinutes').value=l.minutes;if(document.activeElement?.id!=='inLabel')$('inLabel').value=l.label;const rows=data.levels.map((x,i)=>`<div class="row"><span>${i===data.idx?'▶ ':''}${x.label}</span><span>${x.break?'休息':`${x.sb} / ${x.bb} / Ante ${x.ante}`} · ${x.minutes} 分钟</span><button onclick="selectLevel(${i})">选中</button></div>`).join('');if($('levels').innerHTML!==rows)$('levels').innerHTML=rows;persist()}
function pause(){data.remaining=left();data.running=false;data.endsAt=null;persist();render()}function toggleRun(){if(data.running)pause();else{if(left()<=0)data.remaining=current().minutes*60000;data.endsAt=Date.now()+data.remaining;data.running=true;persist();render()}}function move(d){pause();data.idx=Math.max(0,Math.min(data.levels.length-1,data.idx+d));data.remaining=current().minutes*60000;persist();render()}function selectLevel(i){pause();data.idx=i;data.remaining=current().minutes*60000;render()}function resetLevel(){pause();data.remaining=current().minutes*60000;render()}function saveLevel(){pause();let l=current();l.sb=Math.max(0,Number($('inSb').value)||0);l.bb=Math.max(0,Number($('inBb').value)||0);l.ante=Math.max(0,Number($('inAnte').value)||0);l.minutes=Math.max(1,Math.min(240,Number($('inMinutes').value)||1));l.label=$('inLabel').value||`Level ${data.idx+1}`;l.break=false;data.remaining=l.minutes*60000;render()}function addLevel(){pause();const l=data.levels[data.idx];data.levels.splice(data.idx+1,0,{label:`Level ${data.idx+2}`,sb:l.sb?l.sb*2:100,bb:l.bb?l.bb*2:200,ante:l.ante,minutes:l.minutes});data.idx++;data.remaining=current().minutes*60000;render()}function removeLevel(){if(data.levels.length<2)return;pause();data.levels.splice(data.idx,1);data.idx=Math.min(data.idx,data.levels.length-1);data.remaining=current().minutes*60000;render()}function resetAll(){if(confirm('确认恢复默认盲注规则？当前自定义规则会被替换。')){pause();data.levels=defaults.map(x=>({...x}));data.idx=0;data.remaining=1200000;render()}}function renameTable(){let n=prompt('输入比赛或牌桌名称',data.name);if(n){data.name=n;render()}}setInterval(render,200);render();
</script></html>
