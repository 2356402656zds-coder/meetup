<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poker Clock Pro · 本地赛事后台</title>
<style>
:root{color-scheme:dark;--bg:#0b1013;--panel:#151c20;--line:#2b373c;--text:#f4f0e7;--muted:#91a0a5;--gold:#e7be70;--cyan:#86d0d0;--red:#e39a8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"PingFang SC",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:20px 4vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,16,19,.96);z-index:2}h1{margin:0;font-size:24px}h2{margin:0 0 16px;font-size:18px}.brand{color:var(--gold);letter-spacing:.08em}.status{color:var(--cyan)}main{max-width:1400px;margin:auto;padding:28px 4vw 80px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.table-card{min-height:190px}.table-head{display:flex;justify-content:space-between;gap:10px}.table-name{font-size:20px;font-weight:650}.badge{border-radius:99px;padding:4px 10px;font-size:12px;color:#171a1a;background:var(--gold)}.badge.PAUSED,.badge.READY{background:#71828a;color:white}.badge.COMPLETED{background:#628a77;color:white}.time{font:600 50px/1.2 ui-monospace,monospace;color:var(--gold);margin:14px 0 4px}.blind{font-size:18px}.meta{color:var(--muted);line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;background:#202b30;color:var(--text);padding:10px}button{cursor:pointer;font-weight:600}button.primary{background:var(--gold);color:#241f16;border-color:var(--gold)}button.danger{color:var(--red)}input,select{width:100%;margin-top:5px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field{color:var(--muted);font-size:12px}.field button{margin-top:20px}.empty{color:var(--muted);padding:16px 0}.levels{width:100%;border-collapse:collapse;margin-top:12px}.levels th,.levels td{border-bottom:1px solid var(--line);padding:7px;text-align:left}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs button.active{border-color:var(--gold);color:var(--gold)}.hidden{display:none!important}.notice{padding:10px 12px;border-left:3px solid var(--gold);background:#25251f;margin-bottom:15px;color:#e8d8b7}
</style>
<header><div><div class="brand">碰鱼 MEETUP</div><h1>Poker Clock Pro · 赛事后台</h1></div><div id="serverStatus" class="status">正在连接</div></header>
<main><div id="notice" class="notice hidden"></div><div class="tabs"><button class="active" data-tab="dashboard">赛事总览</button><button data-tab="create">创建比赛</button><button data-tab="tables">牌桌管理</button><button data-tab="history">历史赛事</button></div>
<section id="dashboard"><div class="grid" id="tableGrid"></div></section>
<section id="create" class="hidden"><div class="panel"><h2>创建比赛</h2><form id="createForm"><div class="form-grid"><label class="field">比赛名称<input name="name" required placeholder="周末德州锦标赛"></label><label class="field">牌桌<select name="tableId" id="createTable" required></select></label><label class="field">盲注模板<select name="templateId" id="createTemplate" required></select></label><label class="field">初始报名人数<input name="initialPlayers" type="number" min="0" value="30"></label></div><div class="actions"><button class="primary">创建比赛</button></div></form></div></section>
<section id="tables" class="hidden"><div class="panel"><h2>牌桌管理</h2><form id="tableForm"><div class="form-grid"><label class="field">编号<input name="id" required placeholder="A05"></label><label class="field">显示名称<input name="name" required placeholder="A05 TABLE"></label><label class="field"><button class="primary">新增牌桌</button></label></div></form><div id="tableList" class="meta" style="margin-top:18px"></div></div></section>
<section id="history" class="hidden"><div class="panel"><h2>历史赛事</h2><p><a href="/api/tournaments.csv" style="color:var(--gold)">导出 CSV</a></p><div id="historyList"></div></div></section>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)]; let tables=[],templates=[],tournaments=[];
function notice(s){const n=$('#notice');n.textContent=s;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),4000)}
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function fmt(ms){ms=Math.max(0,Number(ms||0));return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')}
function renderDashboard(){
 $('#tableGrid').innerHTML=tables.map(x=>{const s=x.active?.snapshot;const t=x.active?.table;const st=s?.state;const lv=s?.level;return `<article class="panel table-card"><div class="table-head"><div class="table-name">${x.name}</div><span class="badge ${st?.status||'READY'}">${st?.status||'无比赛'}</span></div>${s?`<div class="meta">${s.tournament.name} · Level ${lv.sequence+1}${lv.is_break?' · BREAK':''}</div><div class="time">${fmt(st.remaining_ms)}</div><div class="blind">${lv.is_break?'休息':`SB ${lv.sb} / BB ${lv.bb} / Ante ${lv.ante}`}</div><div class="meta">剩余 ${s.stats.remaining_players} 人 · 买入 ${s.stats.initial_entries} · Re-entry ${s.stats.reentries} · Rebuy ${s.stats.rebuys} · Add-on ${s.stats.addons}</div><div class="actions"><button onclick="action('${s.tournament.id}','${st.status==='RUNNING'?'pause':'start'}')">${st.status==='RUNNING'?'暂停':'开始 / 恢复'}</button><button onclick="action('${s.tournament.id}','next')">下一等级</button><button class="danger" onclick="action('${s.tournament.id}','complete')">结束比赛</button></div>`:'<div class="empty">暂无进行中的比赛</div>'}</article>`}).join('')||'<div class="empty">暂无牌桌</div>';
}
async function load(){try{[tables,templates,tournaments]=await Promise.all([api('/api/tables'),api('/api/templates'),api('/api/tournaments')]);$('#serverStatus').textContent='局域网服务正常';renderDashboard();$('#createTable').innerHTML=tables.filter(x=>x.enabled).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('#createTemplate').innerHTML=templates.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('#tableList').innerHTML=tables.map(x=>`${x.id} · ${x.name} · ${x.enabled?'启用':'停用'}`).join('<br>');$('#historyList').innerHTML=tournaments.filter(x=>['COMPLETED','CANCELLED'].includes(x.tournament?.status||x.status)).map(x=>`<p>${x.tournament?.name||x.name} · ${x.tournament?.status||x.status} · ${x.stats?`报名 ${x.stats.initial_players}，买入 ${x.stats.initial_entries}`:''}</p>`).join('')||'<div class="empty">暂无历史赛事</div>'}catch(e){$('#serverStatus').textContent='服务未连接';notice(e.message)}}
async function action(id,action,delta){try{await api(`/api/tournaments/${id}/action`,{method:'POST',body:JSON.stringify({action,delta})});await load()}catch(e){notice(e.message)}}
$('#createForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/tournaments',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target))) });notice('比赛已创建');e.target.reset();await load();document.querySelector('[data-tab="dashboard"]').click()}catch(x){notice(x.message)}};
$('#tableForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/tables',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target))) });e.target.reset();await load();notice('牌桌已新增')}catch(x){notice(x.message)}};
$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['dashboard','create','tables','history'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab));if(b.dataset.tab==='history')load()});
load();setInterval(load,3000);
</script></html>
